# Weekly updates (§13.9). Major versions wait until after the hackathon (pinned stack, Appendix N).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
