<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
<style>
/*
  Moira — design reference (planning prototype, sample data only).

  Made on 27 Oct 2026, during the hackathon's planning phase, as the visual reference for
  docs/blueprint/BLUEPRINT.md §4.3 and Appendix H. It is not product code: the product is built in web/
  from the blueprint, one task at a time. Port its behaviour and values, not its code structure.

  The idea: the interface is a matte frame and the sky is a window cut into it, darker than the frame.
  Colour lives only in the data: every star takes the colour of its age, the way real stars run from
  blue-white to orange. New memories burn blue-white; old ones glow amber. The timeline under the sky
  is the legend: it is the real count of saves per week, drawn in the same colours.

  Desktop: conversation column on the left (Ask / Recent), the sky window on the right, the card floats
  inside the window. Phone: the sky is full-bleed, the composer sits at the bottom, the conversation and
  the card are sheets you drag.

  Type: Jost (a Futura revival; the space-age face of star charts and the Apollo plaque) for the wordmark,
  constellation names, card titles and the one big sentence. The system face for everything else.
  No monospace, no tracked capitals, no gradients on chrome, no glass, no glows on chrome.
*/
:root{
  color-scheme:dark;
  --ground:#0b0b0c;      /* the frame */
  --sky:#000;            /* the window */
  --surface:#151516;     /* card, sheets */
  --raised:#1e1e20;      /* controls, bubbles, hovered rows */
  --raised-2:#2b2b2e;    /* pressed, selected */
  --text:#f4f4f5;
  --muted:#b4b4b8;       /* 9.5:1 on the frame */
  --faint:#949498;       /* 6.0:1 on surfaces */
  --display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --col:384px; --gap:10px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --composerH:56px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:400 15px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-kerning:normal}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
::selection{background:#fff;color:#000}
.num{font-variant-numeric:tabular-nums}
.skip{position:fixed;left:12px;top:-60px;z-index:50;background:#fff;color:#000;padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Press feedback everywhere (Emil Kowalski: respond on pointer-down) */
.press{transition:transform .1s ease-out, background-color .15s ease}
.press:active{transform:scale(.97)}

/* ---------- Frame: left column ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:calc(var(--col) + var(--safe-l));padding:calc(14px + var(--safe-t)) 14px calc(14px + var(--safe-b)) calc(14px + var(--safe-l));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 6px 0}
.mark{display:block;font:500 21px/1.1 var(--display);letter-spacing:-.01em;margin:0}
.scope{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.seg{display:inline-flex;flex:none;background:var(--raised);border-radius:999px;padding:3px}
.seg button{height:30px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.seg button[aria-selected="true"]{background:var(--raised-2);color:var(--text)}
.seg button:hover{color:var(--text)}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.panel-head{display:none}
.grab{display:none}
.thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:8px 6px 4px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#333 transparent}
.spacer{flex:1 1 auto}
.lately h4{font-size:13px;font-weight:600;color:var(--muted);margin:6px 4px 4px}

/* empty state */
.intro h1{font:400 30px/1.08 var(--display);letter-spacing:-.02em;margin:0 0 10px;max-width:15ch;text-wrap:balance}
.intro p{margin:0 0 18px;color:var(--muted);max-width:34ch}
.tries{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.try{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:14px;background:transparent;text-align:left;color:var(--text);font-size:15px}
.try:hover{background:var(--raised)}
.try svg{flex:none;width:16px;height:16px;color:var(--faint)}

/* messages */
.msg{max-width:100%;animation:rise .38s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg p{margin:0}
.me{align-self:flex-end;max-width:84%;overflow-wrap:anywhere;background:var(--raised-2);color:var(--text);padding:9px 14px;border-radius:20px 20px 6px 20px}
.me .saved-as{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.ai{align-self:stretch;font-size:15.5px;line-height:1.5}
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.clue{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:7px;background:var(--raised);color:var(--text);animation:rise .32s var(--ease-out) both}
.status{color:var(--muted);display:flex;align-items:center;gap:10px}
.status i{width:6px;height:6px;border-radius:50%;background:#dbe5ff;animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.result{display:grid;grid-template-columns:72px 1fr auto;grid-template-rows:auto auto;column-gap:14px;align-items:center;width:100%;margin-top:14px;padding:10px;border:0;border-radius:18px;background:var(--surface);text-align:left}
.result:hover{background:var(--raised)}
.result canvas{grid-row:1 / span 2;width:72px;height:72px;border-radius:12px;background:#000;display:block}
.r-title{grid-column:2 / 4;font-size:15px;font-weight:600;line-height:1.3;align-self:end}
.r-sub{grid-column:2;grid-row:2;align-self:start;margin-top:10px;min-width:0}
.r-meta{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-go{grid-column:3;grid-row:2;align-self:start;margin-top:6px;flex:none;height:32px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center}
.also{margin-top:14px}
.also h4,.card h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:8px 10px;border:0;border-radius:12px;background:transparent;text-align:left;color:var(--text);font-size:14.5px}
.row:hover{background:var(--raised)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{flex:none;font-size:13px;color:var(--faint)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent)}
.fb{display:flex;gap:6px;margin-top:12px;align-items:center}
.fb button{height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--raised);color:var(--muted);font-size:13px}
.fb button:hover{color:var(--text)}
.fb button[aria-pressed="true"]{background:#fff;color:#000}
.fb span{font-size:13px;color:var(--faint);margin-left:4px}

/* recent */
.recent{flex:1;min-height:0;display:flex;flex-direction:column}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 6px 10px;flex:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;height:32px;padding:0 13px;border:0;border-radius:999px;background:var(--raised);color:var(--muted);font-size:13.5px}
.filters button[aria-pressed="true"]{background:#fff;color:#000}
.rlist{flex:1;min-height:0;overflow-y:auto;padding:0 6px 8px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.rday{position:sticky;top:0;z-index:1;background:var(--ground);font-size:13px;font-weight:600;color:var(--muted);padding:12px 4px 6px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;align-items:center;width:100%;padding:9px 10px;border:0;border-radius:12px;background:transparent;text-align:left;color:var(--text)}
.rrow:hover{background:var(--raised)}
.rrow .t{font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .s{grid-column:2;font-size:13px;color:var(--faint);margin-top:2px}
.rrow .m{grid-row:1;grid-column:3;font-size:13px;color:var(--faint)}
.rrow .dot{grid-row:1 / span 2}

/* composer */
.composer{flex:none;display:flex;align-items:center;gap:6px;min-height:var(--composerH);padding:6px 6px 6px 6px;border-radius:28px;background:var(--raised)}
.composer:focus-within{background:#232326}
.composer .seg{background:#141416}
#q{flex:1;min-width:0;height:44px;border:0;background:transparent;color:var(--text);font-size:16px;padding:0 6px}
#q::placeholder{color:var(--faint)}
#q:focus-visible{outline:none}
.ibtn{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--muted)}
.ibtn:hover{background:var(--raised-2);color:var(--text)}
.ibtn svg{width:20px;height:20px}
.send{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:#fff;color:#000}
.send svg{width:18px;height:18px}
.send:disabled{background:var(--raised-2);color:#6e6e72;cursor:default}
.sugg{display:none}

/* ---------- The sky window ---------- */
.skywin{position:fixed;top:calc(10px + var(--safe-t));bottom:calc(10px + var(--safe-b));right:calc(10px + var(--safe-r));left:calc(var(--col) + var(--safe-l) + 2px);border-radius:26px;background:var(--sky);overflow:hidden;isolation:isolate}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.zoom{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:999px;background:var(--surface);transition:right .45s var(--ease-out)}
body.card-open .zoom{right:calc(min(392px, 100% - 24px) + 26px)}
body.card-open .timeline{padding-right:calc(min(392px, 100% - 24px) + 30px)}
.zoom button{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--muted)}
.zoom button:hover{background:var(--raised-2);color:var(--text)}
.zoom svg{width:18px;height:18px}
.lit{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:4px;height:38px;padding:0 4px 0 14px;border-radius:999px;background:var(--surface);font-size:14px;color:var(--text)}
.lit button{height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--raised);color:var(--muted);font-size:13px}
.lit button:hover{color:var(--text)}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);display:flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 16px;border-radius:999px;background:var(--surface);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .3s var(--ease-out);white-space:nowrap;z-index:6}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--raised-2);color:var(--text);font-size:13px;font-weight:600}
.toast.nobtn{padding-right:16px}

/* timeline: the real saves per week, which is also the colour key */
.timeline{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 14px;display:flex;align-items:flex-end;gap:12px;background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));}
.timeline .play{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--surface);color:var(--text)}
.timeline .play:hover{background:var(--raised-2)}
.timeline .play svg{width:16px;height:16px}
.tl-wrap{position:relative;flex:1;min-width:0;height:52px;cursor:ew-resize;touch-action:none}
#tl{position:absolute;inset:0;width:100%;height:100%;display:block}
.tl-label{position:absolute;bottom:100%;margin-bottom:4px;transform:translateX(-50%);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;pointer-events:none}
.tl-label span{font-weight:400;color:var(--muted)}

/* ---------- The card ---------- */
.card{position:absolute;top:12px;right:12px;bottom:12px;width:min(392px, calc(100% - 24px));display:flex;flex-direction:column;border-radius:22px;background:var(--surface);box-shadow:0 30px 80px rgba(0,0,0,.55);z-index:5;overflow:hidden}
.card[hidden]{display:none}
.card-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 22px 18px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#333 transparent}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--raised);color:var(--muted);z-index:2}
.close:hover{background:var(--raised-2);color:var(--text)}
.close svg{width:16px;height:16px}
.card h2{font:400 27px/1.12 var(--display);letter-spacing:-.015em;margin:0 44px 8px 0;text-wrap:balance}
.card .sub{font-size:14px;color:var(--muted);margin:0}
.card .why{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--raised);font-size:14px;color:var(--text)}
.card section{margin-top:22px}
.card p{margin:0}
.bubble-wrap{display:flex;justify-content:flex-end}
.bubble{max-width:92%;background:var(--raised-2);border-radius:20px 20px 6px 20px;padding:10px 14px 8px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.bubble .time{display:block;text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.found{background:var(--raised);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.found .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--raised-2);color:var(--text);font-size:12px;font-weight:600}
.guess{font-size:14.5px;color:var(--muted);line-height:1.5}
.now-line{font:400 22px/1.2 var(--display);letter-spacing:-.01em}
.hist{display:flex;align-items:baseline;gap:10px;width:100%;padding:8px 10px;margin-top:4px;border:0;border-radius:12px;background:transparent;text-align:left;color:var(--muted);font-size:14.5px}
.hist:hover{background:var(--raised)}
.hist s{color:var(--text);text-decoration-thickness:1px}
.hist .m{margin-left:auto;font-size:13px;color:var(--faint)}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px 12px;margin-top:22px;font-size:14px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;min-width:0}
.kv .rel{display:block;color:var(--faint);font-size:13px}
.linkbtn{padding:0;border:0;background:none;color:var(--text);text-align:left;text-decoration:underline;text-decoration-color:#555;text-underline-offset:3px;font-size:14px}
.linkbtn:hover{text-decoration-color:#fff}
.actions{display:flex;gap:4px;margin-top:22px;padding-top:4px}
.actions button{height:34px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px}
.actions button:hover{background:var(--raised);color:var(--text)}
.reveal{animation:rise .42s var(--ease-out) both}

/* ---------- Phone ---------- */
@media (max-width: 899px){
  body{font-size:15px}
  .skywin{inset:0;border-radius:0}
  .side{position:static;width:auto;padding:0}
  .top{position:fixed;z-index:4;top:0;left:0;right:0;padding:calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) 28px calc(16px + var(--safe-l));background:linear-gradient(to bottom, rgba(0,0,0,.78), rgba(0,0,0,0));pointer-events:none}
  .top > *{pointer-events:auto}
  .mark{font-size:20px}
  .scope{display:block;max-width:calc(100vw - 150px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{display:none}
  .recent-btn{display:inline-flex !important}
  .composer{position:fixed;z-index:8;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));bottom:calc(10px + var(--safe-b))}
  .sugg{display:flex;position:fixed;z-index:3;left:0;right:0;bottom:calc(var(--composerH) + 20px + var(--safe-b));gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
  .sugg::-webkit-scrollbar{display:none}
  .sugg button{flex:none;height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--surface);color:var(--text);font-size:14px;white-space:nowrap}
  .sugg[hidden]{display:none}
  .timeline{bottom:calc(var(--composerH) + 14px + var(--safe-b));padding:22px 12px 6px;background:none}
  .has-sugg .timeline{bottom:calc(var(--composerH) + 62px + var(--safe-b))}
  .tl-wrap{height:40px}
  .zoom{display:none}
  .lit{top:calc(76px + var(--safe-t));left:12px}
  .toast{bottom:auto;top:calc(76px + var(--safe-t))}
  /* sheets */
  .panel{position:fixed;z-index:7;left:0;right:0;bottom:0;height:calc(100% - 64px - var(--safe-t));background:var(--surface);border-radius:24px 24px 0 0;padding:0 10px calc(var(--composerH) + 22px + var(--safe-b));box-shadow:0 -20px 60px rgba(0,0,0,.5);transform:translateY(110%);will-change:transform;visibility:hidden}
  .panel.shown{visibility:visible}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 4px;flex:none;touch-action:none}
  .panel-head h2{font:500 18px/1.2 var(--display);margin:0}
  .grab{display:block;width:40px;height:5px;border-radius:3px;background:#3a3a3d;margin:8px auto 2px;flex:none}
  .grab-zone{touch-action:none;cursor:grab;flex:none}
  .spacer,.lately{display:none}
  .thread,.rlist{padding-bottom:calc(var(--hide, 0px) + 12px)}
  .intro{display:none}
  .rday{background:var(--surface)}
  .card{top:auto;left:0;right:0;bottom:0;width:auto;height:calc(100% - 64px - var(--safe-t));border-radius:24px 24px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.55);transform:translateY(110%);will-change:transform;padding-bottom:var(--safe-b)}
  .card .grab{display:block}
  .card-scroll{padding:6px 20px 24px}
  .close{top:14px;right:14px}
  .card h2{font-size:25px;margin-top:6px}
  body.card-open .composer, body.card-open .timeline, body.card-open .sugg, body.card-open .top{opacity:0;pointer-events:none}
  body.card-open .timeline{padding-right:12px}
  .composer,.timeline,.sugg,.top{transition:opacity .2s ease}
}
@media (max-width: 430px){
  .composer .seg button{padding:0 11px}
}
@media (min-width: 900px){
  .recent-btn{display:none !important}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  .press:active{transform:none}
  .status i{animation:none;opacity:1}
}
@media (prefers-reduced-transparency: reduce){
  .timeline{background:#000}
}
</style>
</head>
<body>
<a class="skip" href="#rlist" id="skipLink">Skip to the list of memories</a>

<div class="side" id="side">
  <header class="top">
    <div>
      <p class="mark">Moira</p>
      <span class="scope num" id="scope">Sample memory</span>
    </div>
    <div class="seg tabs" role="tablist" aria-label="View">
      <button class="press" role="tab" id="tabAsk" aria-selected="true" aria-controls="thread">Ask</button>
      <button class="press" role="tab" id="tabRecent" aria-selected="false" aria-controls="recent">Recent</button>
    </div>
    <button class="press recent-btn" id="recentBtn" style="display:none;height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--surface);color:var(--text);font-size:14px;font-weight:500;align-items:center">Recent</button>
  </header>

  <section class="panel" id="panel" aria-label="Conversation">
    <div class="grab-zone" id="panelGrab">
      <div class="grab" aria-hidden="true"></div>
      <div class="panel-head">
        <h2 id="panelTitle">Your sky</h2>
        <button class="close press" id="panelClose" aria-label="Close" style="position:static"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

    ctx.globalAlpha = 1; ctx.drawImage(GLOW[0], px - 16, py - 16, 32, 32);
    ctx.globalCompositeOperation = 'source-over';
    if (p >= 1) { s.unborn = false; s.bornT = now; flares.push({s, t0:now}); haptic('impact'); comet = null; landed(s); }
  }

  /* labels: constellation names far out, star titles close in */
  const placed = reserved.map(b => Object.assign({}, b));
  const fits = (x, y, w, h) => { for (const b of placed) if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return false; placed.push({x, y, w, h}); return true; };
  ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 8;
  const hubA = (1 - smooth(2.0, 3.8, z)) * (introOn ? clamp((now - introT0 - 300) / 900, 0, 1) : 1) * (sel ? lerp(1, .3, focusMix) : 1) * (search ? lerp(1, .45, searchMix) : 1);
  if (hubA > .01) {
    const fs = Math.round(lerp(W < 600 ? 16 : 18, W < 600 ? 14 : 15, smooth(.4, 2.2, z)));
    ctx.textAlign = 'left';
    const order = HUBS.map(h => [h, h.stars.reduce((c, s) => c + (visibleT(s) ? 1 : 0), 0)]).sort((a, b) => b[1] - a[1]);
    for (const [h, n] of order) {
      if (!n) continue;
      const x = (h.x - cam.x) * z + cx, y = (h.y - cam.y) * z + cy - h.s * .95 * z - 12;
      if (x < 0 || x > W || y < 20 || y > Hh + 20) continue;
      ctx.font = '500 ' + fs + 'px ' + DISPLAY;
      const w1 = ctx.measureText(h.name).width;
      ctx.font = '400 13px ' + UI;
      const cnt = String(n), w2 = ctx.measureText(cnt).width;
      const x0 = clamp(x - (w1 + 7 + w2) / 2, 12, W - (w1 + 7 + w2) - 12);
      if (!fits(x0 - 4, y - fs, w1 + 7 + w2 + 8, fs + 8)) continue;
      ctx.font = '500 ' + fs + 'px ' + DISPLAY; ctx.globalAlpha = hubA * .92; ctx.fillStyle = '#f2f2f3';
      ctx.fillText(h.name, x0, y);
      ctx.font = '400 13px ' + UI; ctx.globalAlpha = hubA * .7; ctx.fillStyle = '#b4b4b8';
      ctx.fillText(cnt, x0 + w1 + 7, y);
    }
  }
  const lz = smooth(2.2, 3.4, z), cand = [];
  for (const s of stars) {
    if (!s._on) continue;
    let pr = -1;
    if (s === sel) pr = 100; else if (s === hover) pr = 90;
    else if (s.created && now - s.created < 7000) pr = 80;
    else if (search && search.set.has(s.id)) pr = 60 + s.imp;
    else if (lz > .01) pr = s.imp * 10;
    if (pr >= 0) cand.push([pr, s]);
  }
  cand.sort((a, b) => b[0] - a[0]);
  let count = 0; const budget = W < 600 ? 28 : 70;
  for (const c of cand) {
    if (count > budget) break;
    const pr = c[0], s = c[1], strong = pr >= 60, la = strong ? 1 : lz;
    if (la < .02) continue;
    ctx.font = '500 13px ' + UI;
    const text = s.title.length > 44 ? s.title.slice(0, 42) + '…' : s.title;
    const w = ctx.measureText(text).width, off = (s === sel ? s._r * 2.1 + 11 : s._r * 1.6) + 9;
    const limR = cardOpen && !isNarrow() ? clipR : W - 10;
    let x = s._sx + off, y = s._sy + 4;
    if (x + w > limR) x = s._sx - off - w;
    if (x < 10) { x = clamp(s._sx - w / 2, 10, limR - w); y = s._sy + off + 18; }
    const sub = z > 8 || strong, hh = sub ? 32 : 17;
    if (x + w > limR + 2 || !fits(x - 2, y - 13, w + 6, hh)) continue;
    ctx.globalAlpha = s === sel ? 1 : clamp(Math.min(1, s._a * 1.25) * la, 0, .95);
    ctx.fillStyle = s.replacedBy ? '#9a9a9e' : '#f2f2f3';
    ctx.fillText(text, x, y);
    if (sub) { ctx.font = '400 12px ' + UI; ctx.globalAlpha *= .8; ctx.fillStyle = '#b4b4b8'; ctx.fillText(fmtShort(s.t) + ', ' + SRC_SHORT[s.src], x, y + 16); }
    count++;
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

/* ================= the loop: draw only when something changes ================= */
let bootT = performance.now(), loopOn = false, lastDraw = 0, lastActive = 0, idleTimer = 0;
function busy(now) {
  return !!(flight || zoomA || drag || pinch || comet || flares.length || playing || introOn ||
    Math.abs(vel.x) > .02 || Math.abs(vel.y) > .02 ||
    Math.abs(focusMix - (sel ? 1 : 0)) > .003 || Math.abs(searchMix - (search ? 1 : 0)) > .003 ||
    (sel && now - selT0 < 800) || (search && !RM && now - search.t0 < 6000) || (hover && now - lastActive < 300));
}
function frame(now) {
  loopOn = false;
  if (document.hidden) return;
  if (playing) { const v = playV0 + (now - playT0) / 14000 * 1000; setT(Math.min(1000, v)); if (v >= 1000) { playing = false; setPlayIcon(); } }
  if (flight) stepFlight(now);
  else if (zoomA) stepZoom();
  else if (!drag && !pinch && (Math.abs(vel.x) > .02 || Math.abs(vel.y) > .02)) { cam.x -= vel.x / cam.z; cam.y -= vel.y / cam.z; vel.x *= .93; vel.y *= .93; }
  focusMix = lerp(focusMix, sel ? 1 : 0, RM ? 1 : .12);
  searchMix = lerp(searchMix, search ? 1 : 0, RM ? 1 : .1);
  if (introOn && now - introT0 > 3200) introOn = false;
  draw(now); lastDraw = now;
  if (busy(now)) { lastActive = now; schedule(); return; }
  // Idle: keep a slow twinkle (24 fps, 12 fps after 20 s), none with reduced motion.
  if (RM) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(schedule, now - lastActive > 20000 ? 83 : 41);
}
function schedule() { if (!loopOn) { loopOn = true; requestAnimationFrame(frame); } }
function wake() { lastActive = performance.now(); clearTimeout(idleTimer); schedule(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

function boot() {
  resize();
  renderRecent(); renderLately(); updateScope(); setT(1000);
  const v = fitView();
  if (RM) { cam.x = v.x; cam.y = v.y; cam.z = v.z; }
  else { cam.x = v.x + 60; cam.y = v.y + 30; cam.z = v.z * .78; flyTo(v, {slow:1.6}); }
  introT0 = performance.now(); bootT = introT0;
  wake();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawTimeline(); wake(); });
}
let rT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rT);
  rT = setTimeout(() => {
    const narrow = isNarrow();
    if (!narrow) { sheet.panel.reset(); if (cardOpen) { card.style.transform = ''; } }
    else if (cardOpen && sheet.card.state === 'closed') sheet.card.open('peek');
    resize(); if (!sel) flyTo(fitView());
  }, 120);
});
boot();
})();
</script>
